<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя публічна вебсторінка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background-color: #1a2536;
            color: #ffffff;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .header p {
            color: #a0aec0;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255,255,255,0.15);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 15px;
        }
        .content {
            padding: 30px;
        }
        .content h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #2d3748;
        }
        .content p {
            line-height: 1.6;
            color: #4a5568;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Моя публічна вебсторінка</h1>
            <p>Практичне завдання з дисципліни «Інформаційна культура»</p>
            <span class="badge">HTTPS • Public access</span>
        </div>
        <div class="content">
            <h2>Про сторінку</h2>
            <p>Це моя персональна вебсторінка, опублікована у відкритому доступі з використанням HTTPS. Сторінка створена в межах практичного завдання з дисципліни «Інформаційна культура».</p>
        </div>
    </div>
</body>
</html>
